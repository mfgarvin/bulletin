name: Bulletin processor
run-name: Extract parish information from bulletins
on:
  schedule:
    - cron: '0 14 * * SAT'
  workflow_dispatch:
    inputs:
      stale_days:
        description: 'Days before data is considered stale (0 forces every parish)'
        required: false
        default: '6'
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  PARISH_DB_ID: ${{ secrets.PARISH_DB_ID }}
jobs:
  Bulletin-Processor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run processor
        # The scheduled run has no inputs, so it falls back to main.py's default.
        run: python main.py --all --stale-days ${{ inputs.stale_days || 6 }}
      # TEMPORARY (2026-08-07): adoration is extracted but never written to
      # Notion (UPDATE_ADORATION = False). Keep a copy for manual review.
      # Remove this step once the captured data has been looked at.
      - name: Commit adoration capture
        if: always()
        # Never let the capture fail the workflow: export-data.yml and
        # check-issues.yml both gate on this job's conclusion == 'success'.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adoration_capture.json
          if git diff --staged --quiet; then
            echo "No adoration capture changes"
          else
            git commit -m "Update adoration_capture.json [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi
