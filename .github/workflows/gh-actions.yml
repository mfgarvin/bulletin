name: Bulletin processor
run-name: Extract parish information from bulletins
on:
  schedule:
    - cron: '0 14 * * SAT'
  workflow_dispatch:
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  PARISH_DB_ID: ${{ secrets.PARISH_DB_ID }}
jobs:
  Bulletin-Processor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run processor
        run: python main.py --all
